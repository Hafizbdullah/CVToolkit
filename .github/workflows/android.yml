
name: CV Toolkit - Signed Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Sign APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify Release APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="app/build/outputs/apk/release/app-release.apk"

          if [ -f "$APK" ]; then
            echo "Unsigned APK found."
          elif [ -f "$SIGNED" ]; then
            echo "Release APK already signed by Gradle."
          else
            echo "Release APK not found. Build output:"
            find app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi

      - name: Sign Release APK
        id: sign
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify Signed APK
        shell: bash
        env:
          SIGNED_APK: ${{ steps.sign.outputs.signedReleaseFile }}
        run: |
          test -n "$SIGNED_APK"
          test -f "$SIGNED_APK"
          ls -lh "$SIGNED_APK"

      - name: Publish Final APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('cvtoolkit-build-{0}', github.run_number) }}
          name: CV Toolkit - Final Release ${{ github.run_number }}
          body: |
            CV Toolkit Android Release

            Build type: Release
            APK signing: Enabled
            Source: https://github.com/osscv/CVToolkit

            Original author credits and applicable license terms
            must be preserved.
          files: ${{ steps.sign.outputs.signedReleaseFile }}
          fail_on_unmatched_files: true
          generate_release_notes: true
