name: CV Toolkit - Final Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: cvtoolkit-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Check Project Files
        run: |
          test -f gradlew
          test -f settings.gradle || test -f settings.gradle.kts
          chmod +x gradlew
          echo "Project files verified."

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      # 🔑 توليد keystore تلقائيًا + توقيع APK
      - name: Generate Keystore and Sign APK
        id: sign
        shell: bash
        run: |
          set -euo pipefail

          # بيانات التوقيع الثابتة داخل الكود (لا أسرار)
          KEYSTORE_FILE="signingKey.jks"
          KEY_ALIAS="cvtoolkit"
          STORE_PASS="cvtoolkit-store-pass"
          KEY_PASS="cvtoolkit-key-pass"
          DNAME="CN=CVToolkit, OU=Dev, O=CVToolkit, L=City, ST=State, C=US"

          # 1) توليد keystore جديد
          echo "::group::Generating keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_FILE" \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "$DNAME"
          echo "::endgroup::"

          # 2) تحديد مسار apksigner (أحدث إصدار)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"

          # 3) البحث عن APK غير الموقّع
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*-unsigned.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "::error::Unsigned APK not found."
            find . -type f -name "*.apk"
            exit 1
          fi
          echo "Found unsigned APK: $UNSIGNED_APK"

          # 4) توقيع APK
          SIGNED_APK="app/build/outputs/apk/release/app-release-signed.apk"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          # 5) التحقق من التوقيع
          "$APKSIGNER" verify --verbose "$SIGNED_APK"
          ls -lh "$SIGNED_APK"

          # 6) تمرير المسار للخطوات التالية
          echo "signed_apk=$SIGNED_APK" >> "$GITHUB_OUTPUT"

      - name: Publish Final Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('cvtoolkit-build-{0}', github.run_number) }}
          name: CV Toolkit Final Release ${{ github.run_number }}
          body: |
            CV Toolkit Android Release

            Build Type: Release
            APK: Signed (auto-generated keystore)
            Java: 17

            Original Source:
            https://github.com/osscv/CVToolkit

            Original author credits and license terms must be preserved.
          files: ${{ steps.sign.outputs.signed_apk }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true