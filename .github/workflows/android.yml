
name: CV Toolkit - Final Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: cvtoolkit-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # 1. Download source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install required Android Build Tools
      - name: Install Android Build Tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;29.0.3"
          sdkmanager "build-tools;35.0.0"

      # 6. Check project
      - name: Check Project Files
        run: |
          test -f gradlew
          test -f settings.gradle || test -f settings.gradle.kts
          chmod +x gradlew
          echo "Project files verified."

      # 7. Build Release APK
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      # 8. Locate APK
      - name: Locate Release APK
        id: apk
        shell: bash
        run: |
          APK=$(find . -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            ! -name "*unsigned*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "No Release APK found."
            find . -type f -name "*.apk"
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found: $APK"

      # 9. Sign APK
      - name: Sign Android APK
        id: sign
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: ${{ github.workspace }}/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # 10. Verify signature
      - name: Verify APK Signature
        env:
          APK: ${{ steps.sign.outputs.signedReleaseFile }}
        run: |
          test -f "$APK"
          apksigner verify --verbose "$APK"
          ls -lh "$APK"

      # 11. Publish GitHub Release
      - name: Publish Final Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('cvtoolkit-build-{0}', github.run_number) }}
          name: CV Toolkit Final Release ${{ github.run_number }}
          body: |
            CV Toolkit Android Release

            Build Type: Release
            APK: Signed
            Java: 17

            Original Source:
            https://github.com/osscv/CVToolkit

            Original author credits and license terms must be preserved.
          files: ${{ steps.sign.outputs.signedReleaseFile }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
